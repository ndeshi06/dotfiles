# ========== Theme ==========
# Kitty không hỗ trợ "dark:..., light:..." tự động — bạn cần chọn 1 theme.
# Rose Pine theme (dark)
include themes/rose-pine.conf

# ========== Font ==========
font_family CaskaydiaCove Nerd Font Mono
font_size 13.5

# ========== Window Behavior ==========
# Kitty không có "window-save-state", nhưng có thể nhớ kích thước cửa sổ.
remember_window_size yes
initial_window_width 100c
initial_window_height 30c

# Toàn màn hình
startup_mode fullscreen

# Ẩn thanh tiêu đề
hide_window_decorations yes

# ========== Background ==========
background_opacity 0.9
# Kitty không có "background-blur-radius", nhưng có thể giả lập bằng compositor như picom

# ========== Title ==========
window_title ""
dynamic_title no

# ========== Cursor ==========
cursor_blink_interval 0
cursor_opacity 0.9
# Kitty không có "adjust-cursor-thickness", bạn có thể dùng:
cursor_thickness 1.0

# ========== Platform Specific ==========
# Các tùy chọn macOS như titlebar-proxy-icon không tồn tại trong Linux.

